<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO</title>
</head>
<body>
    <h1>Hello <%= name %></h1>
    <table>
        <% for (const todo of todos) { %>
            <tr>
                <td>
                    <%= todo.done?  '✅' : '❌' %>
                </td>
                <td style="min-width: 100px; max-width: 200px">
                    <a href="/todo/<%= todo.id %>"><%= todo.title %></a>
                </td>
                <td>
                    <form method="post" action="edit-todo/<%= todo.id %>" style="display: inline">
                        <input type="checkbox" name="toggle" checked hidden>
                        <button type="submit">Onačit jako <%= todo.done ? 'ne' : '' %>hotové</button>
                    </form>
                    <% if (todo.done) { %>
                        <a href="/remove-todo/<%= todo.id %>" onclick="return confirm('Opravdu chceš odstranit todo \'<%= todo.title %>\'?')">Odstranit</a>
                    <% } %>
                </td>
            </tr>
        <% } %>
    </table>
    <hr style="width: 300px; margin-left: 0px">
    <form method="post" action="/add-todo" style="width: 250px; border: 2px solid black; margin-bottom: 5px; padding: 5px;">
        <label>
            Název:
            <input type="text" name="title" required placeholder="Název nového todo"/>
        </label><br>
        <label>
            Popis:<br>
            <textarea name="description" placeholder="Popis nového todo" rows="4" cols="30"></textarea>
        </label><br>
        <button type="submit">Přidat todo</button>
    </form>
</body>
</html>
