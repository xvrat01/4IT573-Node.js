<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO</title>
    <style>
        .priority-low {
            color: #00ff0d;
            font-weight: 600;
        }

        .priority-normal {
            color: rgb(255, 115, 0);
            font-weight: 600;
        }

        .priority-high {
            color: #ff0000;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <h1>Hello <%= name %></h1>
    <form method="get" action="/">
        <label>
            Stav:
            <select name="done" onchange="this.form.submit()">
                <option value="all" <%= doneFilter === 'all' ? 'selected' : '' %>>Vše</option>
                <option value="completed" <%= doneFilter === 'completed' ? 'selected' : '' %>>Dokončené</option>
                <option value="pending" <%= doneFilter === 'pending' ? 'selected' : '' %>>Nedokončené</option>
            </select>
        </label>
        <label>
            Priorita:
            <select name="priority" onchange="this.form.submit()">
                <option value="0" <%= priorityFilter === '0' ? 'selected' : '' %>>Vše</option>
                <option value="1" <%= priorityFilter === '1' ? 'selected' : '' %>>Nízká</option>
                <option value="2" <%= priorityFilter === '2' ? 'selected' : '' %>>Normální</option>
                <option value="3" <%= priorityFilter === '3' ? 'selected' : '' %>>Vysoká</option>
            </select>
        </label>
        <label>
            Seřadit podle:
            <select name="sort" onchange="this.form.submit()">
                <option value="default" <%= sort === 'default' ? 'selected' : '' %>>Výchozí</option>
                <option value="doneFirst" <%= sort === 'doneFirst' ? 'selected' : '' %>>Nejdřív dokončené</option>
                <option value="pendingFirst" <%= sort === 'pendingFirst' ? 'selected' : '' %>>Nejdřív nedokončené</option>
                <option value="priorityDesc" <%= sort === 'priorityDesc' ? 'selected' : '' %>>↓ Priority</option>
                <option value="priorityAsc" <%= sort === 'priorityAsc' ? 'selected' : '' %>>↑ Priority</option>
            </select>
        </label>
        <button type="button" onclick="window.location.href='/'" style="margin-left: 8px;">Reset filtrů</button>
    </form>
    <hr style="width: 500px; margin-left: 0px">
    <div id="todos">
        <%- include('_todos.html') %>
    </div>
    <br>
    <% if (todos.filter((todo) => todo.done).length > 0) { %>
        <a href="/delete-completed" onclick="return confirm('Opravdu chceš odstranit všechna dokončená todo?')">Odstranit všechna dokončená todo</a>
    <% } %>
    <hr style="width: 500px; margin-left: 0px">
    <h2>Přidat nové TODO</h2>
    <form method="post" action="/add-todo" style="width: 250px; margin-bottom: 5px; padding: 5px;">
        <label>
            Název:
            <input type="text" name="title" required placeholder="Název nového todo"/>
        </label><br>
        <label>
            Priorita:
            <select name="priority">
                <option value="1">Nízká</option>
                <option value="2" selected>Normální</option>
                <option value="3">Vysoká</option>
            </select>
        </label><br>
        <label>
            Popis:<br>
            <textarea name="description" placeholder="Popis nového todo" rows="4" cols="30"></textarea>
        </label><br>
        <button type="submit">Přidat todo</button>
    </form>
    <hr style="width: 300px; margin-left: 0px">  
    <script>
        const ws = new WebSocket("ws://localhost:8000/ws")

        ws.addEventListener('open', () => {
            console.log('WS open')
            ws.send('Hello, World!')
        })

        ws.addEventListener('message', (event) => {
            const json = JSON.parse(event.data)
            if (json.name === "todosUpdate") {
                console.log('Todos update received:', json)
                fetch(`/todos-filtered` + window.location.search)
                    .then(response => response.text())
                    .then(html => {
                        document.getElementById('todos').innerHTML = html
                    })
            }
        })
    </script>
</body>
</html>
